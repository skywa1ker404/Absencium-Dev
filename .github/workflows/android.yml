name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      - name: Post build errors to a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Gradle build failed."
            echo
            echo "Kotlin and KSP errors:"
            echo '```'
            grep -E '^e: |\[ksp\]' build.log | cut -c1-500 | head -60 || true
            echo '```'
            echo
            echo "Gradle failure summary:"
            echo '```'
            grep -A 16 'What went wrong' build.log | cut -c1-500 | head -50 || true
            echo '```'
            echo
            echo "Last 30 lines:"
            echo '```'
            tail -n 30 build.log | cut -c1-400
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Trajectory-debug.apk
          gh release create "build-${{ github.run_number }}" Trajectory-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Trajectory debug build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}."
