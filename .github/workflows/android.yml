name: Android Build

on:
push:
branches: [main]
paths:
- 'app/'
- 'gradle/'
- 'gradlew'
- 'gradlew.bat'
- 'gradle.properties'
- 'settings.gradle'
- 'settings.gradle.kts'
- 'build.gradle'
- 'build.gradle.kts'
- 'buildSrc/'
- 'build-logic/'
- '.github/workflows/'
pull_request:
branches: [main]
paths:
- 'app/'
- 'gradle/'
- 'gradlew'
- 'gradle.properties'
- 'settings.gradle'
- 'settings.gradle.kts'
- 'build.gradle'
- 'build.gradle.kts'
- 'buildSrc/'
- 'build-logic/'
- '.github/workflows/'
workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Identity guard
        run: |
          # The application ID and database name are Absencium's identity (docs/IDENTITY.md). Changing them
          # needs an explicit migration plan, so the build refuses to continue if either one moved.
          grep -q 'applicationId = "com.absencium.app"' app/build.gradle.kts || { echo "::error::applicationId changed. See docs/IDENTITY.md"; exit 1; }
          grep -q 'DATABASE_NAME = "Absencium.db"' app/src/main/java/com/absencium/app/data/db/AbsenciumDatabase.kt || { echo "::error::Database name changed. See docs/IDENTITY.md"; exit 1; }

      - name: Restore the signing key from secrets (when set)
        env:
          KEYSTORE_B64: ${{ secrets.ABSENCIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/absencium.jks"
            echo "ABSENCIUM_KEYSTORE_FILE=$RUNNER_TEMP/absencium.jks" >> "$GITHUB_ENV"
            echo "ABSENCIUM_KEYSTORE_PASSWORD=${{ secrets.ABSENCIUM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ABSENCIUM_KEY_ALIAS=${{ secrets.ABSENCIUM_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ABSENCIUM_KEY_PASSWORD=${{ secrets.ABSENCIUM_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set; using the upgrade key from the repository."
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      - name: Room schema guard
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each database version's schema is kept in app/schemas. A new version is added automatically; a changed
          # schema under an existing version number means someone forgot to bump the version and write a Migration.
          set -e
          if [ -d app/schemas ]; then
            if ! git diff --quiet -- app/schemas; then
              echo "::error::The Room schema changed without a new database version and Migration."
              git diff -- app/schemas | head -80
              exit 1
            fi
            if [ -n "$(git ls-files --others --exclude-standard app/schemas)" ] && [ "${{ github.event_name }}" = "push" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app/schemas
              git commit -m "Record Room schema for this database version [skip ci]"
              git push origin HEAD:main || echo "Could not push the schema; commit app/schemas manually."
            fi
          fi

      - name: Post build errors to a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Gradle build failed."
            echo
            echo "Kotlin and KSP errors:"
            echo '```'
            grep -E '^e: |\[ksp\]' build.log | cut -c1-500 | head -60 || true
            echo '```'
            echo
            echo "Gradle failure summary:"
            echo '```'
            grep -A 16 'What went wrong' build.log | cut -c1-500 | head -50 || true
            echo '```'
            echo
            echo "Last 30 lines:"
            echo '```'
            tail -n 30 build.log | cut -c1-400
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: absencium-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Absencium-debug.apk
          gh release create "build-${{ github.run_number }}" Absencium-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Absencium debug build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}."

  # An optimised build of the same code (R8 shrinking and optimisation, not debuggable). Debug builds are much
  # slower than this, so it is the one to judge smoothness on. It is an extra: if it fails, the debug APK above
  # is still published.
  assemble-optimized:
    needs: assemble-debug
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the signing key from secrets (when set)
        env:
          KEYSTORE_B64: ${{ secrets.ABSENCIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/absencium.jks"
            echo "ABSENCIUM_KEYSTORE_FILE=$RUNNER_TEMP/absencium.jks" >> "$GITHUB_ENV"
            echo "ABSENCIUM_KEYSTORE_PASSWORD=${{ secrets.ABSENCIUM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ABSENCIUM_KEY_ALIAS=${{ secrets.ABSENCIUM_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ABSENCIUM_KEY_PASSWORD=${{ secrets.ABSENCIUM_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build optimised APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log

      - name: Post build errors to a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The optimised (R8) build failed. The debug APK is unaffected."
            echo
            echo '```'
            grep -E '^e: |^error: |R8|What went wrong' -A 6 build.log | cut -c1-500 | head -70 || true
            echo '```'
            echo
            echo "Last 30 lines:"
            echo '```'
            tail -n 30 build.log | cut -c1-400
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md

      - name: Upload optimised APK
        uses: actions/upload-artifact@v4
        with:
          name: absencium-optimized-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Add the optimised APK to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Absencium-optimized.apk
          gh release upload "build-${{ github.run_number }}" Absencium-optimized.apk \
            --repo "${{ github.repository }}"
