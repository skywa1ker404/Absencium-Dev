name: Android Build

# Development CI for Absencium-Dev. It builds, checks and uploads APK artifacts. It never creates a GitHub Release or a tag:
# development releases only come from the manual "Dev release" workflow.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'build-logic/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'build-logic/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Identity and secret guard
        run: |
          # The channel, the database name and the signing files are part of Absencium's identity and security
          # (docs/IDENTITY.md, docs/SIGNING.md). The build refuses to continue if one of them moved.
          grep -q '^absenciumChannel=dev$' gradle.properties || { echo "::error::gradle.properties must say absenciumChannel=dev in the Dev repository."; exit 1; }
          grep -q 'DATABASE_NAME = "Absencium.db"' app/src/main/java/skywa1ker404/absencium/data/db/AbsenciumDatabase.kt || { echo "::error::Database name changed. See docs/IDENTITY.md"; exit 1; }
          bad=$(git ls-files | grep -E '\.(jks|keystore|p12|pfx|pem)$' | grep -v '^app/signing/absencium-dev\.jks$' || true)
          if [ -n "$bad" ]; then
            echo "::warning::Tracked key files other than the public dev key (see docs/SIGNING.md, to be removed after approval): $bad"
          fi
          if git grep -n -E 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY' -- . ':!docs' >/dev/null; then
            echo "::error::Something that looks like an API key or private key is tracked."; exit 1
          fi

      - name: Build debug APK and run unit tests
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --console=plain 2>&1 | tee build.log

      - name: Room schema guard
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each database version's schema is kept in app/schemas. A new version is added automatically; a changed
          # schema under an existing version number means someone forgot to bump the version and write a Migration.
          set -e
          if [ -d app/schemas ]; then
            if ! git diff --quiet -- app/schemas; then
              echo "::error::The Room schema changed without a new database version and Migration."
              git diff -- app/schemas | head -80
              exit 1
            fi
            if [ -n "$(git ls-files --others --exclude-standard app/schemas)" ] && [ "${{ github.event_name }}" = "push" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app/schemas
              git commit -m "Record Room schema for this database version [skip ci]"
              git push origin HEAD:main || echo "Could not push the schema; commit app/schemas manually."
            fi
          fi

      - name: Post build errors to a commit comment
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Gradle build failed."
            echo
            echo "Kotlin and KSP errors:"
            echo '```'
            grep -E '^e: |\[ksp\]' build.log | cut -c1-500 | head -60 || true
            echo '```'
            echo
            echo "Gradle failure summary:"
            echo '```'
            grep -A 16 'What went wrong' build.log | cut -c1-500 | head -50 || true
            echo '```'
            echo
            echo "Last 30 lines:"
            echo '```'
            tail -n 30 build.log | cut -c1-400
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md

      - name: Verify the APK (application ID, certificate, ABIs, checksum)
        run: bash .github/scripts/verify_apk.sh app/build/outputs/apk/debug/app-debug.apk skywa1ker404.absencium.dev | tee apk-report.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: absencium-dev-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-report.txt
          if-no-files-found: error

  # An optimised build of the same code (R8 shrinking and optimisation, not debuggable). Debug builds are much
  # slower than this, so it is the one to judge smoothness on. It is an extra: if it fails, the debug APK above
  # is still uploaded.
  assemble-optimized:
    needs: assemble-debug
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build optimised APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log

      - name: Post build errors to a commit comment
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The optimised (R8) build failed. The debug APK is unaffected."
            echo
            echo '```'
            grep -E '^e: |^error: |R8|What went wrong' -A 6 build.log | cut -c1-500 | head -70 || true
            echo '```'
            echo
            echo "Last 30 lines:"
            echo '```'
            tail -n 30 build.log | cut -c1-400
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md

      - name: Verify the APK (application ID, certificate, ABIs, checksum)
        run: bash .github/scripts/verify_apk.sh app/build/outputs/apk/release/app-release.apk skywa1ker404.absencium.dev | tee apk-report.txt

      - name: Upload optimised APK
        uses: actions/upload-artifact@v4
        with:
          name: absencium-dev-optimized-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk-report.txt
          if-no-files-found: error
