name: Dependency licence report

# Run by hand from the Actions tab. It reads the licence of every library in the app from the library's own POM file
# and writes docs/DEPENDENCY_LICENSES.md. It builds nothing and publishes nothing.
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolve the release runtime classpath
        run: |
          chmod +x ./gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > deps.txt 2>&1 || { tail -n 40 deps.txt; exit 1; }
          grep -c -- '---' deps.txt || true

      - name: Read the licences
        run: |
          python3 .github/scripts/license_report.py deps.txt body.md
          {
            echo "# Dependency licences"
            echo
            echo "Generated by the \`Dependency licence report\` workflow from \`:app:releaseRuntimeClasspath\` on $(date -u +%Y-%m-%d)."
            echo "Each licence is the one the library's own POM declares; it is not a legal review."
            echo
            cat body.md
          } > docs/DEPENDENCY_LICENSES.md
          cat docs/DEPENDENCY_LICENSES.md

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEPENDENCY_LICENSES.md
          git commit -m "Dependency licence report [skip ci]" || echo "No change."
          git push origin HEAD:main || echo "Could not push the report."

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: docs/DEPENDENCY_LICENSES.md
