name: CI

# Builds and checks every push and pull request. It uploads APK artifacts and never publishes a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Guard
        run: |
          grep -q '^absenciumChannel=stable$' gradle.properties || { echo "::error::gradle.properties must say absenciumChannel=stable."; exit 1; }
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx|pem)$'; then echo "::error::A key file is tracked."; exit 1; fi
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --console=plain
      - name: Verify the APK
        run: bash .github/scripts/verify_apk.sh app/build/outputs/apk/debug/app-debug.apk skywa1ker404.absencium
      - uses: actions/upload-artifact@v4
        with:
          name: absencium-ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
